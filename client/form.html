<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beer Catalog – Beer form</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🍺</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>

<body>
  <!-- Page header with the logo -->
  <header class="app-header">
    <div class="container">
      <h1><img src="img/hop.svg" alt=""> Beer Catalog</h1>
    </div>
  </header>

  <!-- Page content -->
  <main class="container app-main">
    <a href="index.html" class="btn btn-light mb-3"><i class="bi bi-arrow-left"></i> Back to all beers</a>

    <!-- Title: "New beer", or "Edit beer ..." (set by the script) -->
    <h2 class="page-title mb-3" id="formTitle">New beer</h2>
    <!-- Error messages from the API (hidden when empty) -->
    <ul id="errors" class="alert alert-danger ps-5"></ul>


    <!-- One form for both jobs: New (POST) and Edit (PUT) -->
    <form id="beerForm" class="table-card p-4">
      <div class="row mb-3">
        <label for="beer_id" class="col-sm-3 col-form-label fw-semibold">Beer ID</label>
        <div class="col-sm-9"><input id="beer_id" type="number" class="form-control"></div>
      </div>
      <div class="row mb-3">
        <label for="name" class="col-sm-3 col-form-label fw-semibold">Name</label>
        <div class="col-sm-9"><input id="name" type="text" class="form-control"></div>
      </div>
      <div class="row mb-3">
        <label for="style" class="col-sm-3 col-form-label fw-semibold">Style</label>
        <div class="col-sm-9"><input id="style" type="text" class="form-control"></div>
      </div>
      <div class="row mb-3">
        <label for="abv" class="col-sm-3 col-form-label fw-semibold">ABV (%)</label>
        <div class="col-sm-9"><input id="abv" type="number" step="0.1" class="form-control"></div>
      </div>
      <div class="row mb-3">
        <label for="plato" class="col-sm-3 col-form-label fw-semibold">Plato (°P)</label>
        <div class="col-sm-9"><input id="plato" type="number" class="form-control" placeholder="0 to 40"></div>
      </div>
      <!-- Brewery: the user sees the name, the form sends brewery_id -->
      <div class="row mb-3">
        <label for="brewery_id" class="col-sm-3 col-form-label fw-semibold">Brewery</label>
        <div class="col-sm-9">
          <select id="brewery_id" class="form-select">
            <option value="">Choose a brewery…</option>
          </select>
        </div>
      </div>
      <div class="row mb-3">
        <label for="description" class="col-sm-3 col-form-label fw-semibold">Description</label>
        <div class="col-sm-9"><textarea id="description" rows="3" class="form-control"></textarea></div>
      </div>
      <!-- Buttons -->
      <div class="row">
        <div class="col-sm-9 offset-sm-3 d-flex gap-2">
          <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Save</button>
          <a id="cancelLink" href="index.html" class="btn btn-light">Cancel</a>
        </div>
      </div>
    </form>
  </main>

  <script>
    // =====================================================================
    // GIVEN PART (from the tutorial, only field names changed)
    // =====================================================================

    // No id in the address: a new beer. With ?id=19: edit beer 19.
    const id = new URLSearchParams(window.location.search).get("id");

    // Edit mode: change the title, lock the beer_id, Cancel goes back to Details
    if (id) {
      document.getElementById("formTitle").textContent = "Edit beer " + id;
      document.getElementById("beer_id").disabled = true;   // the ID never changes
      document.getElementById("cancelLink").href = "details.html?id=" + encodeURIComponent(id);
    }

    // Read the form into an object, ready to send as JSON (empty number fields are left out)
    function readForm() {
      return {
        beer_id: numberOf("beer_id"),
        name: valueOf("name"),
        style: valueOf("style"),
        abv: numberOf("abv"),
        plato: numberOf("plato"),
        brewery_id: numberOf("brewery_id"),
        description: valueOf("description")
      };
    }

    // Put a beer's values into the form (for Edit; the dropdown must be filled before)
    function fillForm(beer) {
      document.getElementById("beer_id").value = beer.beer_id;
      document.getElementById("name").value = beer.name;
      document.getElementById("style").value = beer.style;
      document.getElementById("abv").value = beer.abv;
      document.getElementById("plato").value = beer.plato;
      document.getElementById("brewery_id").value = beer.brewery_id;
      document.getElementById("description").value = beer.description;
    }

    // Text of a field, and a number field as a number (empty: undefined, so it is not sent)
    function valueOf(fieldId) {
      return document.getElementById(fieldId).value.trim();
    }

    function numberOf(fieldId) {
      const text = document.getElementById(fieldId).value.trim();
      return text === "" ? undefined : Number(text);
    }

    // Show a list of error messages above the form (an empty list clears it)
    function showErrors(messages) {
      const list = document.getElementById("errors");
      list.innerHTML = "";
      for (const message of messages) {
        const item = document.createElement("li");
        item.textContent = message;
        list.appendChild(item);
      }
    }

    // The Save button calls saveBeer()
    document.getElementById("beerForm").addEventListener("submit", (event) => {
      event.preventDefault();
      saveBeer();
    });

    // =====================================================================
    // YOUR CODE (Tutorial 10)
    // =====================================================================

    // A. Edit: load the beer and put its values into the form
    async function loadBeerIntoForm() {
      try {
        // GET /beers/:id
        const response = await fetch("/beers/" + encodeURIComponent(id));
        if (!response.ok) {
          showErrors(["Beer " + id + " not found (status " + response.status + ")"]);
          return;
        }

        // Put the values into the form and show the beer name in the title
        const beer = await response.json();
        fillForm(beer);
        document.getElementById("formTitle").textContent = "Edit beer " + beer.beer_id + " (" + beer.name + ")";
      } catch (error) {
        showErrors(["The API is not running. Start it with: node --env-file=.env server.js"]);
      }
    }

    // Fill the brewery dropdown: the user sees names, the form sends brewery_id
    async function loadBreweries() {
      const response = await fetch("/breweries");
      if (!response.ok) {
        throw new Error("Could not load breweries");
      }
      const breweries = await response.json();
      // Alphabetical order for the dropdown
      breweries.sort((a, b) => a.name.localeCompare(b.name));

      const select = document.getElementById("brewery_id");
      // One <option> per brewery: value = brewery_id (sent to the API), text = name
      for (const brewery of breweries) {
        const option = document.createElement("option");
        option.value = brewery.brewery_id;
        option.textContent = brewery.name;
        select.appendChild(option);
      }
    }

    // B. Save: POST for a new beer, PUT for an existing one
    async function saveBeer() {
      // New: POST /beers. Edit (id in the address): PUT /beers/:id
      const data = readForm();
      let url = "/beers";
      let method = "POST";
      if (id) {
        url = "/beers/" + encodeURIComponent(id);
        method = "PUT";
      }

      try {
        // Send the form as a JSON body (like in Thunder Client)
        const response = await fetch(url, {
          method: method,
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        // Read the API's answer: the saved beer, or error messages
        const result = await response.json();

        // Error: show the messages (400: a list, 404 / 409: one message)
        if (!response.ok) {
          showErrors(result.errors || [result.error]);
          return;
        }

        // Saved: open the Details of this beer (for POST the id comes from the answer)
        window.location.href = "details.html?id=" + encodeURIComponent(id || result.beer_id);
      } catch (error) {
        showErrors(["The API is not running. Start it with: node --env-file=.env server.js"]);
      }
    }

    // C. Fill the dropdown first, then (in Edit mode) the beer
    async function start() {
      try {
        await loadBreweries();
      } catch (error) {
        showErrors(["Could not load the breweries. Is the API running?"]);
        return;
      }
      if (id) {
        loadBeerIntoForm();
      }
    }
    start();
  </script>
</body>

</html>
